# Workspace for the SP1 lifter: a classically-secure succinct lift of ZKBoo
# proofs of seed, cheap to verify on Ethereum L1 today. Stack: SP1 (sdk 6.4.0),
# ratified 2026-08-19 — see knowledge/milestones.md for the amendment record.
# The repository is named for its proof system because other back ends are expected
# alongside it, not because SP1 is the only way to lift these proofs.

[workspace]
resolver = "3"
members = [
    "statement",
    "program",
    "elephant",
    "program-elephant",
    "split",
    "pinned-keys",
    "program-leaf",
    "program-root",
    "program-leaf-elephant",
    "program-root-elephant",
    "host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

# tiny-keccak is patched to SP1's accelerated fork (the Keccak precompile): inside the
# zkVM, this workspace's Keccak256Hasher drives the precompile; on host targets the fork
# compiles to the stock implementation, so digests are identical everywhere.
#
# The zkboo crates ARE patched to local working trees, and that is a reversal.
#
# They used to be required from crates.io at an exact version, so that what a proof was made
# with was recorded in Cargo.lock with a checksum rather than in whatever state a working tree
# happened to be in. That is still the arrangement this project wants. It is not available:
# zkboo 1.2.0 is unpublished, and every version that ever was published is yanked, so there is
# no registry copy of the code these binaries must be built against.
#
# The failure the old arrangement guarded against — a patch silently disengaging when the local
# version stops satisfying the requirement, cargo resolving the published crate instead with no
# warning, and a round of proofs coming out well-formed and failing to verify — is guarded here
# by the requirement itself. Every manifest asks for `=1.2.0`, and no 1.2.0 exists on crates.io;
# a disengaged patch therefore fails to resolve loudly instead of resolving to something else
# quietly. `host/build.rs` additionally refuses to build unless every zkboo crate in the lockfile
# is at that version and comes from a path override, and records the git revision and dirty state
# of each checkout into the binary.
#
# Restore the registry arrangement, and the guard that goes with it, as soon as 1.2.0 is
# published.
[patch.crates-io]
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.0.0" }

zkboo              = { path = "../../zkboo/zkboo" }
zkboo-sha2         = { path = "../../zkboo/zkboo-sha2" }
zkboo-hmac         = { path = "../../zkboo/zkboo-hmac" }
zkboo-modular      = { path = "../../zkboo/zkboo-modular" }
zkboo-ecc          = { path = "../../zkboo/zkboo-ecc" }
zkboo-circuit-hash = { path = "../../zkboo/zkboo-circuit-hash" }
zkboo-profiling    = { path = "../../zkboo/zkboo-profiling" }
zkboo-bip32        = { path = "../../zkboo/zkboo-bip32" }
zkboo-keccak       = { path = "../../zkboo/zkboo-keccak" }
zkboo-ripemd160    = { path = "../../zkboo/zkboo-ripemd160" }

# GPU proving on Apple Silicon, via the Metal backend for SP1 Hypercube. SP1's own GPU
# story is CUDA-only, so without this the prover falls back to the CPU on this machine.
#
# All six must be patched even though this workspace names one or none of them directly:
# `[patch.crates-io]` matches by package name, and they have to resolve to the same copies
# the SDK uses. `p3-uni-stark` contains no GPU code and has no feature to enable — it
# carries a one-line fix labelling preprocessed columns as preprocessed, which is harmless
# upstream and is not harmless to something that compiles those constraints into a kernel:
# without it four recursion AIRs read the main trace where they meant the preprocessed one,
# and compressed proofs do not verify.
#
# Pinned to a tag rather than to the local checkout at <sp1-metal>,
# deliberately: a path patch would let an edit in that checkout move what was measured
# after it was measured, and this repository already keeps a note about that failure.
#
# ⚠️ Once this table is in place, *both* arms of a comparison run through the fork — the
# CPU arm is the fork's CPU path, reached by the SP1_METAL_* runtime switches rather than
# by dropping the patch. That is the comparison sp1-metal itself recommends, because only
# then does nothing but the path under test differ; it is not the same thing as comparing
# against the published crates.
sp1-hypercube        = { git = "https://github.com/hashberg-io/sp1-metal", tag = "v0.1.0" }
slop-jagged          = { git = "https://github.com/hashberg-io/sp1-metal", tag = "v0.1.0" }
slop-multilinear     = { git = "https://github.com/hashberg-io/sp1-metal", tag = "v0.1.0" }
slop-basefold-prover = { git = "https://github.com/hashberg-io/sp1-metal", tag = "v0.1.0" }
slop-dft             = { git = "https://github.com/hashberg-io/sp1-metal", tag = "v0.1.0" }
p3-uni-stark         = { git = "https://github.com/hashberg-io/sp1-metal", tag = "v0.1.0" }

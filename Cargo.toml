# Workspace for the SP1 lifter: a classically-secure succinct lift of ZKBoo
# proofs of seed, cheap to verify on Ethereum L1 today. Stack: SP1 (sdk 6.4.0),
# ratified 2026-08-19 — see knowledge/milestones.md for the amendment record.
# The repository is named for its proof system because other back ends are expected
# alongside it, not because SP1 is the only way to lift these proofs.

[workspace]
resolver = "3"
members = [
    "crates/statement",
    "programs/program",
    "crates/elephant",
    "programs/program-elephant",
    "crates/split",
    "crates/pinned-keys",
    "programs/program-leaf",
    "programs/program-root",
    "programs/program-leaf-elephant",
    "programs/program-root-elephant",
    "crates/host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

# tiny-keccak is patched to SP1's accelerated fork (the Keccak precompile): inside the
# zkVM, this workspace's Keccak256Hasher drives the precompile; on host targets the fork
# compiles to the stock implementation, so digests are identical everywhere.
#
# The zkboo crates are required from crates.io at an exact version, so that what a proof was
# made with is recorded in Cargo.lock with a checksum rather than in whatever state a working
# tree happened to be in. `host/build.rs` refuses to build unless every zkboo crate in the
# lockfile is at the version it names for that crate and comes from crates.io, and records the
# checksums into the binary. Between 2026-09 and 2026-11-24, while the releases were unpublished,
# the crates were patched to local working trees instead and the guard required a path source.
[patch.crates-io]
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.0.0" }

# GPU proving on Apple Silicon, via the Metal backend for SP1 Hypercube. SP1's own GPU
# story is CUDA-only, so without this the prover falls back to the CPU on this machine.
#
# All six must be patched even though this workspace names one or none of them directly:
# `[patch.crates-io]` matches by package name, and they have to resolve to the same copies
# the SDK uses. `p3-uni-stark` contains no GPU code and has no feature to enable — it
# carries a one-line fix labelling preprocessed columns as preprocessed, which is harmless
# upstream and is not harmless to something that compiles those constraints into a kernel:
# without it four recursion AIRs read the main trace where they meant the preprocessed one,
# and compressed proofs do not verify.
#
# Pinned to a revision rather than to the local checkout at <sp1-metal>,
# deliberately: a path patch would let an edit in that checkout move what was measured
# after it was measured, and this repository already keeps a note about that failure.
#
# Moved off tag `v0.1.0` on 2026-09-08. That tag carries the intermittent wrong Merkle tree
# this repository reported and worked around with SP1_METAL_MERKLE=0, at the cost of most of
# the backend's advantage (4.72x down to 1.92x). Upstream reproduced it, root-caused it to a
# pointer-keyed buffer hand-off table that could match an entry left on a freed address,
# fixed it, and held 400 proofs clean under the checking mode the same work added. The
# hand-off itself now defaults off, which removes the hazard class rather than bounding it.
#
# A revision, not a tag, because upstream's manifest says 1.0.0 but no v1.0.0 tag has been
# cut; a revision is more precise than a tag in any case and needs no release decision to be
# made on our behalf.
#
# ⚠️ Once this table is in place, *both* arms of a comparison run through the fork — the
# CPU arm is the fork's CPU path, reached by the SP1_METAL_* runtime switches rather than
# by dropping the patch. That is the comparison sp1-metal itself recommends, because only
# then does nothing but the path under test differ; it is not the same thing as comparing
# against the published crates.
sp1-hypercube        = { git = "https://github.com/hashberg-io/sp1-metal", rev = "cab9ba36db3103a71341d2fd07f00c96710f2e87" }
slop-jagged          = { git = "https://github.com/hashberg-io/sp1-metal", rev = "cab9ba36db3103a71341d2fd07f00c96710f2e87" }
slop-multilinear     = { git = "https://github.com/hashberg-io/sp1-metal", rev = "cab9ba36db3103a71341d2fd07f00c96710f2e87" }
slop-basefold-prover = { git = "https://github.com/hashberg-io/sp1-metal", rev = "cab9ba36db3103a71341d2fd07f00c96710f2e87" }
slop-dft             = { git = "https://github.com/hashberg-io/sp1-metal", rev = "cab9ba36db3103a71341d2fd07f00c96710f2e87" }
p3-uni-stark         = { git = "https://github.com/hashberg-io/sp1-metal", rev = "cab9ba36db3103a71341d2fd07f00c96710f2e87" }

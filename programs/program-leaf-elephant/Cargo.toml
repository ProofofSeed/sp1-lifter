[package]
name = "pofseed-sp1-lift-program-leaf-elephant"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zkVM program: replays ONE response of a secp256k1 Ethereum-address proof."
publish = false

[dependencies]
sp1-zkvm = { version = "=6.4.0" }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
zkboo = { version = "=1.3.0", features = ["u32", "u64"] }
pofseed-sp1-lift-elephant = { path = "../../crates/elephant" }
pofseed-sp1-lift-split = { path = "../../crates/split" }

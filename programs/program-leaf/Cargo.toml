[package]
name = "pofseed-sp1-lift-program-leaf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zkVM program: replays ONE ZKBoo response and commits its view commitments."
publish = false

[dependencies]
sp1-zkvm = { version = "=6.4.0" }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
zkboo = { version = "=1.3.1", features = ["u32", "u64"] }
pofseed-sp1-lift-statement = { path = "../../crates/statement" }
pofseed-sp1-lift-split = { path = "../../crates/split" }

[package]
name = "pofseed-sp1-lift-program-root"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zkVM program: aggregates per-response leaf proofs under the global Fiat-Shamir gate."
publish = false

[dependencies]
sp1-zkvm = { version = "=6.4.0", features = ["verify"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
zkboo = { version = "=1.3.0", features = ["u32", "u64"] }
zkboo-circuit-hash = { version = "=1.3.0" }
pofseed-sp1-lift-statement = { path = "../../crates/statement" }
pofseed-sp1-lift-split = { path = "../../crates/split" }
pofseed-sp1-lift-pinned-keys = { path = "../../crates/pinned-keys" }

[package]
name = "snark-lifter-program-leaf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zkVM program: replays ONE ZKBoo response and commits its view commitments."
publish = false

[dependencies]
sp1-zkvm = { version = "6.0.1" }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
zkboo = { version = "1.0.0", features = ["keccak", "u32", "u64"] }
snark-lifter-statement = { path = "../statement" }
snark-lifter-split = { path = "../split" }

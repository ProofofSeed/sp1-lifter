[package]
name = "sp1-lifter-program-leaf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zkVM program: replays ONE ZKBoo response and commits its view commitments."
publish = false

[dependencies]
sp1-zkvm = { version = "=6.4.0" }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
zkboo = { version = "=1.2.0", features = ["u32", "u64"] }
sp1-lifter-statement = { path = "../statement" }
sp1-lifter-split = { path = "../split" }

[package]
name = "snark-lifter-program-elephant"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zkVM program: verifies a secp256k1 (Ethereum address) ZKBoo proof of seed inside SP1, for cost probing."
publish = false

[dependencies]
sp1-zkvm = { version = "=6.4.0" }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
zkboo = { version = "=1.2.0", features = ["u32", "u64"] }
zkboo-circuit-hash = { version = "=1.2.0" }
snark-lifter-elephant = { path = "../elephant" }

[package]
name = "snark-lifter-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host side of the SNARK lifter: proof generation, zkVM execution and proving drivers."
publish = false
build = "build.rs"

[dependencies]
# native-gnark: the Groth16/PLONK wrap runs in-process via a locally-built gnark (pure
# Go, arm64-native) — no Docker, no external service. Practically verified on this
# machine 2026-08-19.
sp1-sdk = { version = "6.0.1", features = ["blocking", "native-gnark"] }
# Prover tuning knobs (shard thresholds, trace chunk slots) live in `SP1CoreOpts`, which
# the SDK does not re-export.
sp1-core-executor = { version = "6.0.1" }
hex = { version = "0.4" }
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0.228" }
zkboo = { version = "1.0.0", features = ["keccak", "u32", "u64", "parallel"] }
zkboo-bip32 = { version = "1.0.0" }
zkboo-circuit-hash = { version = "1.0.0" }
snark-lifter-statement = { path = "../statement" }
snark-lifter-elephant = { path = "../elephant" }
zkboo-profiling = { version = "1.0.0" }

[build-dependencies]
sp1-build = { version = "6.0.1" }

[[bin]]
name = "cycle-probe"
path = "src/main.rs"

[[bin]]
name = "s1-acceptance"
path = "src/bin/s1_acceptance.rs"

[[bin]]
name = "lift"
path = "src/bin/lift.rs"

[[bin]]
name = "elephant-probe"
path = "src/bin/elephant_probe.rs"

[package]
name = "sp1-lifter-program-leaf-elephant"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zkVM program: replays ONE response of a secp256k1 Ethereum-address proof."
publish = false

[dependencies]
sp1-zkvm = { version = "=6.4.0" }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
zkboo = { version = "=1.2.0", features = ["u32", "u64"] }
sp1-lifter-elephant = { path = "../elephant" }
sp1-lifter-split = { path = "../split" }

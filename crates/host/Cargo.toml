[package]
name = "pofseed-sp1-lift-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host side of the SNARK lifter: proof generation, zkVM execution and proving drivers."
publish = false
build = "build.rs"

[features]
# Cargo unifies features across the graph, so naming these here reaches sp1-sdk's copies
# of the same crates. Four features against six patched crates: slop-jagged is turned on
# by sp1-hypercube/metal, and p3-uni-stark's fix is not feature-gated at all.
#
# Off by default. Build with `--features metal` and use the SP1_METAL_* switches to force
# the CPU path, so that both arms of a comparison are one binary.
metal = [
    "sp1-hypercube/metal",
    "slop-dft/metal",
    "slop-multilinear/metal",
    "slop-basefold-prover/metal",
]

[dependencies]
# native-gnark: the Groth16/PLONK wrap runs in-process via a locally-built gnark (pure
# Go, arm64-native) — no Docker, no external service. Practically verified on this
# machine 2026-08-19.
sp1-sdk = { version = "=6.4.0", features = ["blocking", "native-gnark"] }
# Prover tuning knobs (shard thresholds, trace chunk slots) live in `SP1CoreOpts`, which
# the SDK does not re-export.
# `profiling` turns on the executor's cycle-tracker: it parses `cycle-tracker-start/end:`
# lines out of the guest's stdout and totals the instructions between them, which is the only
# way to decompose a guest's cost by region. Without it those lines pass through as ordinary
# output and `ExecutionReport::cycle_tracker` stays empty — which reads exactly like a region
# that cost nothing.
sp1-core-executor = { version = "=6.4.0", features = ["profiling"] }
hex = { version = "0.4" }
zeroize = { version = "1.8.2" }
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0.228" }
zkboo = { version = "=1.2.0", features = ["u32", "u64", "parallel"] }
zkboo-bip32 = { version = "=1.2.0" }
zkboo-circuit-hash = { version = "=1.2.0" }
pofseed-sp1-lift-statement = { path = "../../crates/statement" }
pofseed-sp1-lift-elephant = { path = "../../crates/elephant" }
pofseed-sp1-lift-split = { path = "../../crates/split" }
pofseed-sp1-lift-pinned-keys = { path = "../../crates/pinned-keys" }
sha2 = { version = "0.10" }
sp1-prover = { version = "=6.4.0" }
sp1-hypercube = { version = "=6.4.0" }
# Named only so that the `metal` feature above can reach them; this crate's own code
# never mentions them.
slop-dft = { version = "=6.4.0" }
slop-multilinear = { version = "=6.4.0" }
slop-jagged = { version = "=6.4.0" }
slop-basefold-prover = { version = "=6.4.0" }
zkboo-profiling = { version = "=1.2.0" }

[build-dependencies]
sp1-build = { version = "=6.4.0" }

[[bin]]
name = "cycle-probe"
path = "src/main.rs"

[[bin]]
name = "s1-acceptance"
path = "src/bin/s1_acceptance.rs"

[[bin]]
name = "lift"
path = "src/bin/lift.rs"

[[bin]]
name = "elephant-probe"
path = "src/bin/elephant_probe.rs"

[[bin]]
name = "split-probe"
path = "src/bin/split_probe.rs"

[[bin]]
name = "stream-lift"
path = "src/bin/stream_lift.rs"

[[bin]]
name = "elephant-split"
path = "src/bin/elephant_split.rs"

[[bin]]
name = "statement-units"
path = "src/bin/statement_units.rs"

[[bin]]
name = "vkeys"
path = "src/bin/vkeys.rs"

[package]
name = "snark-lifter-statement"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared statement definitions for the SNARK lifter: proof-of-seed circuits, the fixed crypto suite, and the host/guest wire format."
publish = false

[dependencies]
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
# The enabled zkboo word features (u32, u64 — and u8, which is default-on) determine the
# postcard layout of `Words` and hence the `LiftInput` wire format. They are pinned here,
# in the one crate both sides depend on; enabling further word features anywhere in either
# workspace changes the frame layout and MUST bump `LIFT_FRAME_VERSION` in src/lib.rs.
zkboo = { version = "0.1.0", features = ["keccak", "u32", "u64"] }
zkboo-bip32 = { version = "0.1.0" }

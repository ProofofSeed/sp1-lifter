[package]
name = "sp1-lifter-statement"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared statement definitions for the SNARK lifter: proof-of-seed circuits, the fixed crypto suite, and the host/guest wire format."
publish = false

[dependencies]
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
# The enabled zkboo word features (u32, u64 — and u8, which is default-on) determine the
# postcard layout of `Words` and hence the `LiftInput` wire format. They are pinned here,
# in the one crate both sides depend on; enabling further word features anywhere in either
# workspace changes the frame layout and MUST bump `LIFT_FRAME_VERSION` in src/lib.rs.
zkboo = { version = "=1.2.0", features = ["u32", "u64"] }
zkboo-bip32 = { version = "=1.2.0" }
# The crypto suite's hasher. `zkboo` shipped a Keccak-256 `Hasher` until 1.2.0 moved it into
# the (unpublishable) development harness, so this crate carries its own; see src/hasher.rs.
# The workspace patches this to SP1's accelerated fork, so the same code drives the zkVM's
# Keccak precompile in a guest and the stock implementation on the host.
tiny-keccak = { version = "2.0", default-features = false, features = ["keccak"] }
zeroize = { version = "1.8.2" }

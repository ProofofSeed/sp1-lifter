[package]
name = "snark-lifter-program-root"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zkVM program: aggregates per-response leaf proofs under the global Fiat-Shamir gate."
publish = false

[dependencies]
sp1-zkvm = { version = "6.0.1", features = ["verify"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
zkboo = { version = "1.0.0", features = ["keccak", "u32", "u64"] }
zkboo-circuit-hash = { version = "1.0.0" }
snark-lifter-statement = { path = "../statement" }
snark-lifter-split = { path = "../split" }
